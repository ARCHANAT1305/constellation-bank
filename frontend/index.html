<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Constellation · Multi-Agent Banking Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
      <circle cx="16" cy="16" r="3.2" fill="#f5b84b"/>
      <circle cx="16" cy="16" r="9" fill="none" stroke="#f5b84b" stroke-opacity=".35" stroke-dasharray="2 3"/>
      <circle cx="7" cy="10" r="2.2" fill="#4fd1c5"/><circle cx="25" cy="10" r="2.2" fill="#ff6b6b"/><circle cx="16" cy="27" r="2.2" fill="#a78bfa"/>
    </svg>
    <div><b>Constellation</b><span>multi-agent banking desk · simulated</span></div>
  </div>
  <div class="top-right">
    <span id="modeBadge" class="badge">connecting…</span>
    <button id="resetBtn" class="ghost" title="Reset demo data and conversation">Reset demo</button>
  </div>
</header>

<main class="grid">
  <section class="left">
    <div class="card orbit-card">
      <div class="card-h"><span>Agent constellation</span><span class="hint" id="orbitHint">idle · waiting for a request</span></div>
      <svg id="orbit" viewBox="0 0 600 400" role="img" aria-label="Live agent routing diagram"></svg>
    </div>
    <div class="card trace-card">
      <div class="card-h"><span>Flight recorder</span><button id="clearTrace" class="ghost sm">Clear</button></div>
      <div id="trace" class="trace"><div class="empty">Every routing decision, tool call, guardrail and approval shows up here, in order.</div></div>
    </div>
  </section>

  <section class="right card chat-card">
    <div class="snap" id="snap"></div>
    <div id="chat" class="chat"></div>
    <div class="chips" id="chips"></div>
    <form id="form" class="composer" autocomplete="off">
      <input id="input" placeholder="Ask the bank anything… e.g. “Block my credit card”" maxlength="400" />
      <button id="send" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 11.5 21 3l-8.5 18-2-7.5z" fill="currentColor"/></svg>
      </button>
    </form>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
